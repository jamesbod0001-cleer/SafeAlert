<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Transparency — SafeAlert NG</title>
  <link rel="icon" type="image/png" href="icons/icon-512.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/legal-pages.css"/>
  <style>
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      color: var(--text2);
    }
    .stat-row:last-child { border-bottom: none; padding-bottom: 0; }
    .stat-row strong { color: var(--text); font-weight: 700; font-size: 15px; }
    .loading { color: var(--text2); font-size: 14px; padding: 24px 0; text-align: center; }
    .privacy-list { font-size: 14px; color: var(--text2); padding-left: 1.25em; margin-top: 10px; }
    .privacy-list li { margin-bottom: 6px; }
    .privacy-list strong { color: var(--text); }
  </style>
</head>
<body data-legal-title="meta.transparency_title" data-legal-page="transparency">
  <div class="legal-page">
    <header class="legal-top">
      <a class="legal-back" href="index.html" aria-label="Back to app">←</a>
      <span class="legal-top-title" data-i18n="meta.site">SafeAlert NG</span>
    </header>

    <div class="legal-hero">
      <h1 data-i18n="trans.hero.title">Transparency</h1>
      <p class="lead" data-i18n="trans.hero.lead">Open stats about alerts, moderation, and our community network.</p>
    </div>

    <div id="report" class="loading" aria-live="polite" data-i18n="trans.loading">Loading report…</div>

    <footer class="legal-footer-nav">
      <a class="btn btn-primary" href="index.html" data-i18n="common.back">← Back to app</a>
      <a class="btn btn-ghost" href="faq.html" data-i18n="common.faq">FAQ</a>
      <a class="btn btn-ghost" href="privacy.html" data-i18n="common.privacy">Privacy</a>
    </footer>
  </div>

  <script src="js/legal-i18n.js?v=20260612c"></script>
  <script src="js/legal-bootstrap.js?v=20260612c"></script>
  <script>
    const API = (location.origin && location.origin !== 'null') ? location.origin + '/v1' : 'http://localhost:3000/v1';

    function t(key) {
      return (window.SafeAlertLegal && window.SafeAlertLegal.t(key)) || key;
    }

    function renderReport(r) {
      document.getElementById('report').innerHTML = `
        <section class="legal-section">
          <h2 data-i18n="trans.sec.zones">${t('trans.sec.zones')}</h2>
          <div class="legal-card">
            <div class="stat-row"><span>${t('trans.stat.active')}</span><strong>${r.zones.active}</strong></div>
            <div class="stat-row"><span>${t('trans.stat.verified')}</span><strong>${r.zones.community_verified}</strong></div>
            <div class="stat-row"><span>${t('trans.stat.community')}</span><strong>${r.zones.by_source.community}</strong></div>
            <div class="stat-row"><span>${t('trans.stat.hdx')}</span><strong>${r.zones.by_source.acled_and_hdx}</strong></div>
            <div class="stat-row"><span>${t('trans.stat.hidden')}</span><strong>${r.zones.hidden_after_false_reports}</strong></div>
          </div>
        </section>
        <section class="legal-section">
          <h2>${t('trans.sec.mod')}</h2>
          <div class="legal-card">
            <div class="stat-row"><span>${t('trans.stat.flags')}</span><strong>${r.moderation.false_report_flags}</strong></div>
            <div class="stat-row"><span>${t('trans.stat.demo')}</span><strong>${r.moderation.simulated_data_blocked ? t('trans.yes') : t('trans.no')}</strong></div>
          </div>
        </section>
        <section class="legal-section">
          <h2>${t('trans.sec.community')}</h2>
          <div class="legal-card">
            <div class="stat-row"><span>${t('trans.stat.leaders')}</span><strong>${r.community.verified_leaders}</strong></div>
            <div class="stat-row"><span>${t('trans.stat.pending')}</span><strong>${r.community.pending_leader_applications}</strong></div>
            <div class="stat-row"><span>${t('trans.stat.agents')}</span><strong>${r.community.active_field_agents}</strong></div>
          </div>
        </section>
        <section class="legal-section">
          <h2>${t('trans.sec.privacy')}</h2>
          <div class="legal-card">
            <p style="font-size:14px;color:var(--text2);margin-bottom:8px">${r.privacy.note}</p>
            <ul class="privacy-list">
              <li>${t('trans.privacy.gov')} <strong>${t('trans.no')}</strong></li>
              <li>${t('trans.privacy.police')} <strong>${t('trans.no')}</strong></li>
              <li>${t('trans.privacy.sold')} <strong>${t('trans.no')}</strong></li>
              <li>${t('trans.privacy.anon')} <strong>${t('trans.yes')}</strong></li>
            </ul>
            <p class="legal-meta" style="margin-top:14px;margin-bottom:0">${new Date(r.generated_at).toLocaleString()}</p>
          </div>
        </section>`;
    }

    window.__legalTransRerender = function () {
      if (window.__legalTransData) renderReport(window.__legalTransData);
    };

    fetch(API + '/transparency')
      .then((res) => res.json())
      .then(({ report: r }) => {
        window.__legalTransData = r;
        renderReport(r);
      })
      .catch(() => {
        document.getElementById('report').innerHTML = `
          <div class="legal-highlight warn">${t('trans.err')}</div>`;
      });
  </script>
</body>
</html>
